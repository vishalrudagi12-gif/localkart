server:
  port: 8080

spring:
  application:
    name: localbazaar
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  datasource:
    url: jdbc:mysql://localhost:3306/localbazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bazaar
    password: bazaar
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:localbazaar-dev-secret-change-me-32chars-min!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  uploads:
    dir: ./uploads
  mail:
    from: ${MAIL_FROM:noreply@localbazaar.local}
  dev:
    auto-approve-sellers: false
